name: Publish to GitHub Pages

on:
  push:
    branches:
      - main  

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4 

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e "install.packages(c('rmarkdown', 'knitr', 'xml2', 'downlit', 'tidyverse'))"

      - name: Render English version
        run: quarto render --profile en

      - name: Render French version
        run: quarto render --profile fr

      - name: Create landing page
        run: |
          cp _landing-page.html _book/index.html
          mkdir -p _book/images
          cp images/sat_earth.png _book/images/sat_earth.png
          touch _book/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _book