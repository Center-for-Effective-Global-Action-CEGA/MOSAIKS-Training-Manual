<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOSAIKS Training Manual</title>
  <link rel="icon" type="image/png" href="images/sat_earth.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      color: #2c3e50;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      border-radius: 50%;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #7b8a8b;
      margin-bottom: 2rem;
    }
    .lang-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .lang-btn {
      display: inline-block;
      font-size: 1.1rem;
      padding: 0.75rem 2.5rem;
      border: none;
      border-radius: 0.375rem;
      background-color: #2c3e50;
      color: white;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .lang-btn:hover {
      background-color: #1a252f;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/sat_earth.png" alt="MOSAIKS" class="logo" onerror="this.style.display='none'">
    <h1>MOSAIKS Training Manual</h1>
    <p class="subtitle">
      Please select your preferred language<br>
      Veuillez choisir votre langue préférée
    </p>
    <div class="lang-buttons">
      <a href="en/index.html" class="lang-btn">English</a>
      <a href="fr/index.html" class="lang-btn">Français</a>
    </div>
  </div>
</body>
</html>
