profile:
  group:
    - [default, en, fr]

project:
  type: book

book:
  reader-mode: true
  favicon: "images/sat_earth.png"
  cover-image: "images/sat_earth.png"
  site-url: https://center-for-effective-global-action-cega.github.io/MOSAIKS-Training-Manual/
  repo-url: https://github.com/Center-for-Effective-Global-Action-CEGA/MOSAIKS-Training-Manual/
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd

tbl-cap-location: bottom

bibliography: references.bib

format:
  html:
    theme: 
      light: flatly
      dark: slate
    highlight-style: atom-one
    css: style.scss
    code-link: true    
    callout-appearance: simple

filters:
    - openlinksinnewpage

execute:
  freeze: auto
  echo: true
  message: false
  warning: false